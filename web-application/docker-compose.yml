services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend (FastAPI) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      # Use the same multi-stage Dockerfile for dev; override CMD below
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      ENVIRONMENT: development
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    expose:
      - "8000"
    # In dev: mount source for hot-reload, override CMD with --reload
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ─── Frontend (Vite dev server) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      # Use only the builder stage for dev (npm run dev inside)
      target: builder
    depends_on:
      - backend
    expose:
      - "5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

  # ─── Nginx (reverse proxy) ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8000}:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/downloads.conf:/etc/nginx/sheetmind-downloads.conf:ro
      - ${WEB_DOWNLOADS_DIR:-./downloads}:/srv/sheetmind-downloads:ro
    restart: unless-stopped

volumes:
  postgres_data:
