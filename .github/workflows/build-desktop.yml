name: Package SheetMind Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: windows
            binary-suffix: .exe
          - os: macos-latest
            platform: macos
            binary-suffix: ''
          - os: ubuntu-latest
            platform: linux
            binary-suffix: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            desktop-application/frontend/package-lock.json
            desktop-application/electron/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Cache Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: desktop-application/backend/.nuitka-cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('desktop-application/backend/pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuitka-${{ hashFiles('desktop-application/backend/pyproject.toml') }}-
            ${{ runner.os }}-nuitka-

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"

      - name: Run Build Script (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./desktop-application/build-windows.ps1 -Version ${{ env.VERSION }}

      - name: Run Build Script (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ./desktop-application/build-linux.sh ${{ env.VERSION }}

      - name: Run Build Script (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          ./desktop-application/build-macos.sh ${{ env.VERSION }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetmind-installer-${{ matrix.platform }}
          path: |
            desktop-application/electron/dist/*.exe
            desktop-application/electron/dist/*.dmg
            desktop-application/electron/dist/*.AppImage
            desktop-application/electron/dist/*.deb
          if-no-files-found: error
