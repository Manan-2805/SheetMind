# Ruff is now the primary linter and formatter for this project.
[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "duckdb>=1.5.2",
    "fastapi>=0.136.1",
    "matplotlib>=3.10.9",
    "openai>=2.34.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "python-multipart>=0.0.27",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pylint>=4.0.5",
    "ruff>=0.3.0",
]

[tool.pylint.main]
rcfile = ".pylintrc"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # Errors, PyFlakes, Warnings
    "I",                # isort
    "PL",               # Pylint
    "UP",               # pyupgrade
    "RUF",              # Ruff-specific
    "B",                # Bugbear
    "C4",               # Comprehensions
    "SIM",              # Simplify
    "DTZ",              # Datetime
    "FA",               # Future annotations
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value used in comparison
    "E501",     # Line too long (we control via line-length)
    "PLW2901",  # Loop variable overwritten
    "B008",     # Do not perform function call in argument defaults (noisy for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "alembic", "duckdb", "pandas", "openpyxl", "uvicorn"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
